[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scopefix"   # must be unique on PyPI
version = "0.1.0"
description = "An agentic tool to fix vulnerabilities"
readme = "README.md"
authors = [
    { name="chittapu abhiram reddy", email="abhirampabc@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"

dependencies = [
    "requests",
    "numpy",
    "bandit==1.9.2",
    "beautifulsoup4",
    "gradient==3.10.1",
    "langchain-gradient==0.1.24",
    "langgraph",
    "pydantic",
    "tiktoken",
]

[project.urls]
Homepage = "https://github.com/Abhiram-29/scopefix"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
scopefix = "scopefix.cli:cli_fix"